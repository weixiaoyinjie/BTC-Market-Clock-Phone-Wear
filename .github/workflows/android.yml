name: Build Android Phone and Wear OS APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu hosted runners already include Android SDK. Avoid
      # android-actions/setup-android@v3, which may fail when it tries
      # to install obsolete SDK tools before the project can build.
      - name: Verify Android SDK (API 35)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK root: $SDK_ROOT"

          missing=()
          if [[ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]]; then
            missing+=("platforms;android-35")
          fi
          if [[ ! -d "$SDK_ROOT/build-tools/35.0.0" ]]; then
            missing+=("build-tools;35.0.0")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "Installing missing Android components: ${missing[*]}"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then
              echo "Missing sdkmanager: $SDKMANAGER" >&2
              exit 1
            fi
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "${missing[@]}"
          else
            echo "Android API 35 and Build Tools 35.0.0 already installed."
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -d "$SDK_ROOT/build-tools/35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build phone and watch debug APKs
        run: gradle :phone:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Upload phone APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-MarketClock-Phone-Debug
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-MarketClock-Wear-Debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
